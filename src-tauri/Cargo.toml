[package]
name = "ncm-dump-gui"
version = "0.1.0"
description = "NetEase Cloud Music ncm converter with rich metadata"
authors = ["animinzes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This only seems to be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ncm_dump_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 解密核心
aes = "0.8"
base64 = "0.22"

# 标签写入
lofty = "0.22"

# 网络（blocking：在 rayon 工作线程里同步调用）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

# 并行
rayon = "1"

# 工具
dirs = "6"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# See the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
